<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta de Equipos y Pautas</title>
<meta name="description" content="Bitácora de equipos y corrección con rúbricas en escala 1,0 a 7,0. Funciona sin internet.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/atkinson-hyperlegible@5.3.0/files/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/atkinson-hyperlegible@5.3.0/files/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Zilla Slab';font-style:normal;font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/zilla-slab@5.3.0/files/zilla-slab-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Zilla Slab';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/zilla-slab@5.3.0/files/zilla-slab-latin-700-normal.woff2) format('woff2')}
:root{
  /* Layout: libreta de registro. Pestañas arriba; en pantallas anchas, lista a la izquierda y detalle a la derecha; en angostas, una columna con botón para volver. Sin animaciones ni degradados: pensado para tinta electrónica. */
  --paper:#ffffff;
  --ink:#111111;
  --ink-soft:#4a4a4a;
  --line-soft:#bdbdbd;
  --fill:#e4e4e4;
  --accent:#1d4a3a;
  --roja:#a01818;
  --font-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --fs-xs:.875rem; --fs-sm:1rem; --fs-md:1.125rem; --fs-lg:1.375rem; --fs-xl:1.75rem; --fs-xxl:2.25rem;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;animation:none!important;transition:none!important}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(12px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* Cabecera */
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.cab h1{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xxl);line-height:1;margin:0}
.cab h1 span{font-weight:500;font-size:var(--fs-lg)}
.sub{margin-top:6px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
.cab-der{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.guardado{font-size:var(--fs-xs);color:var(--ink-soft)}
.pestanas{display:grid;grid-template-columns:1fr 1fr .7fr;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.pest{min-height:56px;border:0;background:var(--paper);font:700 var(--fs-md)/1.2 var(--font-body);color:var(--ink);cursor:pointer;padding:6px 8px}
.pest+.pest{border-left:2px solid var(--ink)}
.pest[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Controles */
.btn{min-height:48px;padding:6px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 var(--fs-sm)/1.2 var(--font-body);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:transparent;text-decoration:underline;padding-inline:8px}
.btn.grande{min-height:60px;font-size:var(--fs-md);padding-inline:26px}
.btn.chico{min-height:40px;padding:4px 12px;font-size:var(--fs-xs)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;padding:0;min-height:36px;font:700 var(--fs-xs) var(--font-body);color:var(--ink);text-decoration:underline;cursor:pointer;text-align:left}
label{font-weight:700;font-size:var(--fs-sm)}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;font-size:var(--fs-md);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.acciones{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ayuda{font-size:var(--fs-sm);color:var(--ink-soft)}
.form-error{font-weight:700;border-left:5px solid var(--ink);padding:4px 0 4px 12px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.confirmar{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;border:2px dashed var(--ink);padding:8px 10px;border-radius:4px;font-weight:700;font-size:var(--fs-sm)}
.msg{border:2px solid var(--ink);background:var(--fill);padding:10px 14px;font-weight:700}
.alerta{border:3px solid var(--ink);padding:12px 14px;font-weight:700}
.copia{border:2px solid var(--ink);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.copia textarea{font-size:var(--fs-xs);font-family:ui-monospace,Menlo,Consolas,monospace}
.titulo-sec{font-family:var(--font-display);font-size:var(--fs-xl);margin:0;line-height:1.1}
.etiqueta{margin:0 0 8px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.vacio{border:2px dashed var(--ink);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.vacio h3{font-family:var(--font-display);font-size:var(--fs-xl);margin:0;line-height:1.1}
.vacio p{max-width:60ch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.chip.atencion{background:var(--fill)}
.chip.riesgo{background:var(--ink);color:var(--paper)}

/* Bitácora */
.bit{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:760px){.bit{grid-template-columns:clamp(220px,28%,300px) minmax(0,1fr);align-items:start}.solo-angosto{display:none!important}}
@media (max-width:759px){.bit.con-detalle .lista{display:none}.bit:not(.con-detalle) .detalle{display:none}}
.lista{display:flex;flex-direction:column;gap:10px}
.lista-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.equipo{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);cursor:pointer;font:inherit}
.equipo[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.eq-nombre{font-family:var(--font-display);font-weight:700;font-size:var(--fs-lg);line-height:1.15}
.eq-proy{font-size:var(--fs-sm);line-height:1.35}
.eq-meta{font-size:var(--fs-xs);font-weight:700}
.detalle{display:flex;flex-direction:column;gap:22px;min-width:0}
.volver{align-self:flex-start}
.det-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.det-cab > div{min-width:0;flex:1 1 320px}
.det-cab h2{font-family:var(--font-display);font-size:var(--fs-xxl);line-height:1.05;margin:4px 0 8px}
.eyebrow{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.proyecto{max-width:62ch}
.integrantes{font-size:var(--fs-sm)}
.etapas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.etapa{min-height:58px;border:0;border-left:2px solid var(--ink);background:var(--paper);font:700 var(--fs-xs)/1.2 var(--font-body);color:var(--ink);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow-wrap:anywhere}
.etapa:first-child{border-left:0}
.etapa small{font-weight:400}
.etapa.hecha{background:var(--fill)}
.etapa[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (max-width:560px){.etapas{grid-template-columns:minmax(0,1fr)}.etapa{border-left:0;border-top:2px solid var(--ink);flex-direction:row;justify-content:flex-start;gap:10px;padding:0 14px;min-height:48px}.etapa:first-child{border-top:0}}
.estados{display:flex;flex-wrap:wrap;gap:8px}
.registros{display:flex;flex-direction:column;gap:16px}
.reg-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.reg-cab h3{font-family:var(--font-display);font-size:var(--fs-xl);margin:0}
.reg-cab h3 span{font-family:var(--font-body);font-size:var(--fs-sm);font-weight:400}
.registro{border-bottom:1px solid var(--line-soft);padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.registro header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.registro time{font-family:var(--font-display);font-weight:700;font-size:var(--fs-lg)}
.reg-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-xs);font-weight:700}
.registro dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px 16px}
@media (min-width:700px){.registro dl{grid-template-columns:168px minmax(0,1fr)}}
.registro dt{font-weight:700;font-size:var(--fs-sm);padding-top:2px}
.registro dd{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.reg-acc{display:flex;flex-wrap:wrap;gap:8px}
.paginador{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.paginador span{font-size:var(--fs-sm);font-weight:700}
.form{display:flex;flex-direction:column;gap:12px;border:2px solid var(--ink);border-radius:4px;padding:16px}
.form h3{font-family:var(--font-display);font-size:var(--fs-lg);margin:0}
.fila-2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:700px){.fila-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* Pautas */
.pautas{display:flex;flex-direction:column;gap:18px}
.selectores{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.selectores{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sel-fila{display:flex;gap:8px;flex-wrap:wrap}
.sel-fila select{flex:1 1 220px;width:auto}
.ficha{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--ink);padding:2px 0 2px 14px}
.ficha p{font-size:var(--fs-sm);max-width:80ch}
.escala{color:var(--ink-soft)}
.segmento{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--ink);border-radius:4px;overflow:hidden;align-self:flex-start;max-width:100%}
.seg{min-height:48px;border:0;background:var(--paper);color:var(--ink);font:700 var(--fs-sm) var(--font-body);padding:6px 18px;cursor:pointer}
.seg+.seg{border-left:2px solid var(--ink)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav-grupo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:560px){.nav-grupo{grid-template-columns:1fr 1fr}.g-actual{grid-column:1/-1;order:-1}}
.g-actual{display:flex;flex-direction:column;gap:4px;min-width:0}
.g-num{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em}
.marcador{position:sticky;top:env(safe-area-inset-top, 0px);z-index:2;background:var(--paper);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 22px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:8px 0}
.m-bloque{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.m-et{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.m-val{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xl);font-variant-numeric:tabular-nums;line-height:1}
.m-nota .m-val{font-size:2.75rem;color:var(--accent)}
.m-nota .m-val.roja{color:var(--roja);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.m-falta{font-weight:700;font-size:var(--fs-sm)}
.crono{align-items:center}
.crono-meta{font-size:var(--fs-sm);color:var(--ink-soft)}
.crono-t.pasado{text-decoration:underline;text-decoration-thickness:3px}
.crono-reg{font-size:var(--fs-xs);font-weight:700}
.criterios{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:24px}
.criterio h4{margin:0 0 10px;font-family:var(--font-display);font-size:var(--fs-lg);display:flex;gap:10px;align-items:baseline;line-height:1.2}
.c-num{font-family:var(--font-body);font-size:var(--fs-xs);font-weight:700;border:2px solid var(--ink);padding:0 6px;border-radius:3px;flex:none}
.niveles{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px}
@media (max-width:699px){.niveles{grid-template-columns:minmax(0,1fr)}}
.nivel{text-align:left;border:2px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);padding:10px 12px;min-height:64px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}
.nivel[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.n-cab{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:var(--fs-sm);line-height:1.2}
.n-cab span{flex:none}
.n-desc{font-size:var(--fs-xs);line-height:1.4;overflow-wrap:anywhere}
.pie-corr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--ink);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.stat{background:var(--paper);padding:10px 14px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.tabla-wrap{overflow-x:auto;border:2px solid var(--ink);border-radius:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:var(--fs-sm)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{border-bottom:2px solid var(--ink);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
td small{display:block;color:var(--ink-soft);font-size:var(--fs-xs)}
td.roja{color:var(--roja);font-weight:700;text-decoration:underline}
.leyenda{font-size:var(--fs-xs);color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 16px}

/* Editores */
.editor{display:flex;flex-direction:column;gap:16px}
.editor h2{font-family:var(--font-display);font-size:var(--fs-xl);margin:0}
fieldset{border:2px solid var(--ink);border-radius:4px;padding:12px 14px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-weight:700;padding:0 6px}
.nivel-ed{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}
@media (max-width:480px){.nivel-ed{grid-template-columns:minmax(0,1fr) 90px}.nivel-ed .btn{grid-column:1/-1}}
.crit-ed{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.crit-ed-cab{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.crit-ed-cab .campo{flex:1 1 260px}
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opcion{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.opcion b{font-family:var(--font-display);font-size:var(--fs-lg)}
.opcion span{font-size:var(--fs-sm)}

/* Respaldo */
.respaldo{display:flex;flex-direction:column;gap:22px;max-width:820px}
.bloque{display:flex;flex-direction:column;gap:10px}
.bloque h2{font-family:var(--font-display);font-size:var(--fs-xl);margin:0}
.bloque p,.bloque li{max-width:66ch}
.pasos{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.conteo{font-size:var(--fs-sm);font-weight:700}
</style>
</head>
<body>
<main class="app" id="app"></main>

<script>
(function(){
'use strict';

/* ---------- Constantes ---------- */
var LKEY='libreta-equipos-pautas:datos', UIKEY='libreta-equipos-pautas:ui';
var COLS=['equipos','bitacora','rubricas','cursos','evaluaciones'];
var ETAPAS=['Investigación','Diseño','Prototipo','Pruebas','Presentación'];
var ESTADOS=[{k:'ok',t:'Al día',g:'✓'},{k:'atencion',t:'Requiere atención',g:'!'},{k:'riesgo',t:'En riesgo',g:'✕'}];
var POR_PAGINA=4;
var $app=document.getElementById('app');
var mqAncho=window.matchMedia('(min-width: 760px)');

var S={}; var meta={ultimoRespaldo:null,creado:null}; var almacenOK=true; var persistente=null; var swListo=false;
var ui={tab:'bitacora',teamId:null,teamMode:'ver',teamDraft:null,entryOpen:false,entryDraft:null,editingEntry:null,entryPage:0,
  confirm:null,formError:null,msg:null,rubricaId:null,cursoId:null,pView:'corregir',grupoIdx:0,editor:null,draft:null,draftId:null,
  comentarios:{},copiaManual:null,importPend:null};
var crono={inicio:null,acumulado:0,intervalo:null};

/* ---------- Utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return String(n).padStart(2,'0');}
function hoyISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ahora(){return new Date().toISOString();}
function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
var fmtLarga=new Intl.DateTimeFormat('es-CL',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
var fmtCorta=new Intl.DateTimeFormat('es-CL',{day:'numeric',month:'short'});
function fecha(s){var d=parseISO(s);return d?fmtLarga.format(d).replace(/\./g,''):'Sin fecha';}
function fechaCorta(s){var d=parseISO(s);return d?fmtCorta.format(d).replace(/\./g,''):'';}
function num(n,dec){if(n==null||isNaN(n))return '—';var s=dec==null?String(Math.round(n*10)/10):Number(n).toFixed(dec);return s.replace('.',',');}
function mmss(seg){seg=Math.max(0,Math.round(seg||0));return pad(Math.floor(seg/60))+':'+pad(seg%60);}
function clonar(o){return JSON.parse(JSON.stringify(o));}
function sinId(o){var c=clonar(o);delete c.id;return c;}
function lista(col){return Object.keys(S[col]).map(function(id){var o=Object.assign({},S[col][id]);o.id=id;return o;}).sort(function(a,b){return String(a.creado||'').localeCompare(String(b.creado||''))||a.id.localeCompare(b.id);});}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'archivo';}
function foco(id){setTimeout(function(){var el=document.getElementById(id);if(el)el.focus();},0);}
function esAncho(){return mqAncho.matches;}
function diasDesde(iso){if(!iso)return null;return Math.floor((Date.now()-new Date(iso).getTime())/86400000);}

/* ---------- Datos iniciales ---------- */
function rubricaExposicion(creado){
  return {nombre:'Exposición oral de una presentación',

    criterios:[
      {id:'contenido',nombre:'Contenido',descriptores:['Se nota un buen dominio del tema, no comete errores, no duda.','Demuestra un buen entendimiento de partes del tema. Exposición fluida, comete pocos errores.','Tiene que hacer algunas rectificaciones, y en ocasiones duda.','Rectifica continuamente. El contenido es mínimo, no muestra un conocimiento del tema.']},
      {id:'organizacion',nombre:'Organización de la información',descriptores:['La información está bien organizada, de forma clara y lógica.','La mayor parte de la información se organiza de forma clara y lógica, aunque de vez en cuando alguna diapositiva está fuera de lugar.','No existe un plan claro para organizar la información, cierta dispersión.','La información aparece dispersa y poco organizada.']},

      {id:'noverbal',nombre:'Lenguaje no verbal',descriptores:['Tiene buena postura, y demuestra seguridad en sí mismo durante la presentación. Establece contacto visual con todos los presentes.','Tiene buena postura la mayor parte del tiempo y establece contacto visual con todos los presentes. En ocasiones se muestra inseguro.','Algunas veces tiene buena postura y en ocasiones establece contacto visual con todos los presentes. Muestra inseguridad.','Tiene mala postura y no establece contacto visual con los presentes. Muestra gran inseguridad.']},

      {id:'soporte',nombre:'Soporte',descriptores:['La exposición se acompaña de soportes visuales atractivos y de mucha calidad (imágenes, videos, etc.), que se utilizan de manera efectiva para apoyar y mejorar la presentación.','Utiliza soportes visuales adecuados e interesantes (imágenes, videos, etc.), aunque hay margen para mejorar en su uso.','Los recursos visuales utilizados son limitados y poco efectivos, aunque adecuados, no logran captar el interés de los estudiantes (imágenes, vídeos, etc.).','No se utilizan recursos visuales o se utilizan de manera ineficaz, resultando en soportes visuales inadecuados.']},

    ]};

/* ---------- Almacenamiento local ---------- */
function normalizar(o){var r={};COLS.forEach(function(c){r[c]=(o&&o[c]&&typeof o[c]==='object')?o[c]:{};});return r;}
function cargar(){
  var raw=null;
  try{raw=localStorage.getItem(LKEY);}catch(e){almacenOK=false;}
  if(raw){
    try{var o=JSON.parse(raw);S=normalizar(o.datos);meta=Object.assign({ultimoRespaldo:null,creado:null},o.meta||{});return;}
    catch(e){try{localStorage.setItem(LKEY+':danado-'+Date.now(),raw);}catch(e2){}}
  }
  S=normalizar(semilla());meta={ultimoRespaldo:null,creado:ahora()};guardar();
}
function guardar(){
  if(!almacenOK)return false;

  catch(e){almacenOK=false;flash('No se pudo guardar en esta tableta. Descarga un respaldo ahora para no perder los cambios.');return false;}
}

/* ---------- Archivos ---------- */
function descargar(nombre,texto,tipo){
  try{
    var blob=new Blob([texto],{type:tipo});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=nombre;a.rel='noopener';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);
    flash('Descarga iniciada: «'+nombre+'». Lo encuentras en la carpeta Descargas.');
    return true;
  }catch(e){ui.copiaManual={titulo:'No se pudo descargar el archivo. Selecciona el texto, cópialo y guárdalo o pégalo en tu planilla.',texto:texto};return false;}
}
function puedeCompartir(tipo,ext){try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.'+ext,{type:tipo})]}));}catch(e){return false;}}
function compartir(nombre,texto,tipo){
  try{
    var f=new File([texto],nombre,{type:tipo});
    navigator.share({files:[f],title:nombre}).catch(function(e){if(e&&e.name==='AbortError')return;flash('No se pudo compartir. Usa el botón Descargar.');render();});
  }catch(e){flash('No se pudo compartir. Usa el botón Descargar.');render();}
}
function copiar(texto,ok){
  function manual(){ui.copiaManual={titulo:'Selecciona el texto y cópialo para pegarlo en tu planilla.',texto:texto};render();seleccionarCopia();}
  try{navigator.clipboard.writeText(texto).then(function(){flash(ok);render();},manual);}catch(e){manual();}
}
function seleccionarCopia(){setTimeout(function(){var t=document.getElementById('copia-manual');if(t){t.focus();t.select();}},0);}
function celdaCSV(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function aCSV(filas){return '﻿'+filas.map(function(f){return f.map(celdaCSV).join(';');}).join('\r\n');}
function aTSV(filas){return filas.map(function(f){return f.map(function(v){return String(v==null?'':v).replace(/[\t\r\n]+/g,' ');}).join('\t');}).join('\n');}

function equipoActual(){return ui.teamId&&S.equipos[ui.teamId]?Object.assign({id:ui.teamId},S.equipos[ui.teamId]):null;}
function registrosDe(id){return lista('bitacora').filter(function(r){return r.equipoId===id;}).sort(function(a,b){return String(b.fecha).localeCompare(String(a.fecha))||String(b.creado).localeCompare(String(a.creado));});}
function estadoInfo(k){for(var i=0;i<ESTADOS.length;i++)if(ESTADOS[i].k===k)return ESTADOS[i];return null;}

/* ---------- Pautas: consultas y cálculo ---------- */
function rubActual(){return ui.rubricaId&&S.rubricas[ui.rubricaId]?Object.assign({id:ui.rubricaId},S.rubricas[ui.rubricaId]):null;}
function cursoActual(){return ui.cursoId&&S.cursos[ui.cursoId]?Object.assign({id:ui.cursoId},S.cursos[ui.cursoId]):null;}
function evalId(r,c,g){return r+'__'+c+'__'+g;}
function maxNivel(r){var m=0;(r.niveles||[]).forEach(function(n){var p=+n.puntos;if(isFinite(p)&&p>m)m=p;});return m;}
function rubMax(r){return (r.criterios||[]).length*maxNivel(r);}
function puntaje(r,ev){
  var p=0,h=0;var sel=ev&&ev.seleccion||{};
  (r.criterios||[]).forEach(function(c){var li=sel[c.id];if(li!=null&&r.niveles[li]){p+=+r.niveles[li].puntos||0;h++;}});
  return {p:p,hechos:h,total:(r.criterios||[]).length};
}
/* Escala chilena 1,0–7,0: con exigencia e, el 4,0 se alcanza con e·máximo; redondeo a un decimal. */
function nota(p,max,e){
  e=e||0.6;if(max<=0)return null;var corte=e*max,n;
  if(p<corte)n=1+3*p/corte;else n=4+3*(p-corte)/(max-corte);
  n=Math.round(n*10+1e-9)/10;return Math.min(7,Math.max(1,n));
}
function asegurarSel(){
  var rs=lista('rubricas'),cs=lista('cursos');
  if(!rubActual())ui.rubricaId=rs.length?rs[0].id:null;
  if(!cursoActual())ui.cursoId=cs.length?cs[0].id:null;
  var c=cursoActual();var n=c?(c.grupos||[]).length:0;
  if(ui.grupoIdx>=n)ui.grupoIdx=Math.max(0,n-1);if(ui.grupoIdx<0)ui.grupoIdx=0;
}
function ctxEval(){
  var r=rubActual(),c=cursoActual();if(!r||!c)return null;var g=(c.grupos||[])[ui.grupoIdx];if(!g)return null;
  return {r:r,c:c,g:g,id:evalId(r.id,c.id,g.id)};
}
function evalBase(ctx){
  var prev=S.evaluaciones[ctx.id];
  var b=prev?clonar(prev):{rubricaId:ctx.r.id,cursoId:ctx.c.id,grupoId:ctx.g.id,seleccion:{},comentario:'',creado:ahora()};
  if(!b.seleccion)b.seleccion={};
  if(ui.comentarios[ctx.id]!==undefined)b.comentario=ui.comentarios[ctx.id];
  return b;
}
function escalaTexto(r){
  var max=rubMax(r),e=r.exigencia||0.6;
  return 'Escala 1,0 a 7,0 · exigencia '+Math.round(e*100)+' % · nota 4,0 con '+num(e*max)+' de '+num(max)+' puntos · redondeo a un decimal';
}
function filasPlanilla(r,c){
  var max=rubMax(r);
  var cab=['Estudiante','Equipo'].concat(r.criterios.map(function(k,i){return 'C'+(i+1)+' '+k.nombre;}),['Puntaje','Puntaje máximo','Nota']);
  if(r.minutos)cab.push('Duración');cab.push('Retroalimentación');
  var filas=[cab];
  (c.grupos||[]).forEach(function(g){
    var ev=S.evaluaciones[evalId(r.id,c.id,g.id)];var sc=puntaje(r,ev);var completo=sc.total>0&&sc.hechos===sc.total;
    var n=completo?num(nota(sc.p,max,r.exigencia),1):'';
    var pts=r.criterios.map(function(k){var li=ev&&ev.seleccion?ev.seleccion[k.id]:null;return li!=null&&r.niveles[li]?num(+r.niveles[li].puntos):'';});
    var miembros=(g.integrantes&&g.integrantes.length)?g.integrantes:[g.nombre];
    var eq=(g.integrantes&&g.integrantes.length)?g.nombre:'';
    miembros.forEach(function(m){
      var f=[m,eq].concat(pts,[sc.hechos?num(sc.p):'',num(max),n]);
      if(r.minutos)f.push(ev&&ev.duracionSeg?mmss(ev.duracionSeg):'');
      f.push(ev&&ev.comentario||'');filas.push(f);
    });
  });
  return filas;
}
function filasBitacora(){
  var filas=[['Equipo','Proyecto','Fecha','Etapa','Estado','Avance','Próximos pasos','Apoyo que necesitan']];
  lista('equipos').forEach(function(t){registrosDe(t.id).slice().reverse().forEach(function(r){var e=estadoInfo(r.estado);filas.push([t.nombre,t.proyecto||'',r.fecha||'',r.etapa||'',e?e.t:'',r.avance||'',r.proximos||'',r.apoyo||'']);});});
  return filas;
}

function vResumen(r,c){
  var gs=c.grupos||[],max=rubMax(r);
  var filas=gs.map(function(g,i){var ev=S.evaluaciones[evalId(r.id,c.id,g.id)],sc=puntaje(r,ev),ok=sc.total>0&&sc.hechos===sc.total;return {g:g,i:i,ev:ev,sc:sc,ok:ok,n:ok?nota(sc.p,max,r.exigencia):null};});
  var hechas=filas.filter(function(f){return f.ok;}),notas=hechas.map(function(f){return f.n;});

  var h='<div class="stats"><div class="stat">Corregidos<b>'+hechas.length+' de '+gs.length+'</b></div><div class="stat">Promedio<b>'+(prom==null?'—':num(prom,1))+'</b></div><div class="stat">Aprobados<b>'+apr+(notas.length?' ('+Math.round(apr/notas.length*100)+' %)':'')+'</b></div><div class="stat">Rango<b>'+(notas.length?num(Math.min.apply(null,notas),1)+' – '+num(Math.max.apply(null,notas),1):'—')+'</b></div></div>';
  h+='<div class="tabla-wrap"><table><thead><tr><th class="num">N°</th><th>Equipo o estudiante</th>'+r.criterios.map(function(k,i){return '<th class="num" title="'+esc(k.nombre)+'">C'+(i+1)+'</th>';}).join('')+'<th class="num">Puntaje</th><th class="num">Nota</th>'+(r.minutos?'<th class="num">Tiempo</th>':'')+'<th>Estado</th></tr></thead><tbody>'+
    filas.map(function(f){
      var cells=r.criterios.map(function(k){var li=f.ev&&f.ev.seleccion?f.ev.seleccion[k.id]:null;return '<td class="num">'+(li!=null&&r.niveles[li]?num(+r.niveles[li].puntos):'·')+'</td>';}).join('');
      var estado=f.ok?'Corregido':(f.sc.hechos?'Faltan '+(f.sc.total-f.sc.hechos):'Pendiente');
      return '<tr><td class="num">'+(f.i+1)+'</td><td><button type="button" class="link" data-a="g-go" data-i="'+f.i+'">'+esc(f.g.nombre)+'</button>'+(f.g.integrantes&&f.g.integrantes.length?'<small>'+esc(f.g.integrantes.join(', '))+'</small>':'')+'</td>'+cells+
        '<td class="num">'+(f.sc.hechos?num(f.sc.p):'—')+'</td><td class="num'+(f.ok&&f.n<4?' roja':'')+'">'+(f.ok?num(f.n,1):'—')+'</td>'+(r.minutos?'<td class="num">'+(f.ev&&f.ev.duracionSeg?mmss(f.ev.duracionSeg):'—')+'</td>':'')+'<td>'+estado+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  h+='<p class="leyenda">'+r.criterios.map(function(k,i){return '<span>C'+(i+1)+': '+esc(k.nombre)+'</span>';}).join('')+'<span>Notas bajo 4,0 subrayadas en rojo.</span></p>';
  h+='<div class="acciones"><button type="button" class="btn primary" data-a="export-csv">Descargar planilla (CSV)</button><button type="button" class="btn" data-a="copy-tsv">Copiar para pegar en planilla</button>'+(puedeCompartir('text/csv','csv')?'<button type="button" class="btn" data-a="share-csv">Compartir planilla</button>':'')+'</div>';
  h+='<p class="ayuda">La planilla trae una fila por estudiante, con la nota de su equipo, lista para el libro de clases. Usa punto y coma y coma decimal, como Excel en Chile.</p>';
  return h;
}

function parsearCurso(txt){
  return String(txt||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var k=l.indexOf(':');
    if(k>0){return {nombre:l.slice(0,k).trim(),integrantes:l.slice(k+1).split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean)};}
    return {nombre:l,integrantes:[]};
  });
}
function cuentaCurso(txt){
  var gs=parsearCurso(txt);var eq=gs.filter(function(g){return g.integrantes.length;}).length;var ind=gs.length-eq;
  var est=gs.reduce(function(a,g){return a+(g.integrantes.length||1);},0);
  var partes=[];if(eq)partes.push(eq+(eq===1?' equipo':' equipos'));if(ind)partes.push(ind+(ind===1?' estudiante individual':' estudiantes individuales'));
  return partes.length?partes.join(' · ')+' · '+est+' estudiantes en total':'Aún no hay nombres';
}

    var fr=new FileReader();
    fr.onload=function(){
      try{var o=JSON.parse(fr.result);if(!o||o.app!=='libreta-equipos-pautas'||!o.datos)throw new Error('formato');
        var dd=normalizar(o.datos);
        ui.importPend={datos:dd,exportado:o.exportado,resumen:Object.keys(dd.equipos).length+' equipos, '+Object.keys(dd.bitacora).length+' registros, '+Object.keys(dd.rubricas).length+' rúbricas, '+Object.keys(dd.cursos).length+' cursos y '+Object.keys(dd.evaluaciones).length+' correcciones'};
      }catch(err){flash('Ese archivo no es un respaldo de esta libreta. Elige el archivo .json que descargaste desde Respaldo.');}
      render();
    };
    fr.onerror=function(){flash('No se pudo leer el archivo. Inténtalo de nuevo.');render();};
    fr.readAsText(el.files[0]);return;
  }
  if(!el.dataset||!el.dataset.sel)return;
  if(el.dataset.sel==='rub'){flushComentario();ui.rubricaId=el.value;}
  else if(el.dataset.sel==='cur'){flushComentario();ui.cursoId=el.value;ui.grupoIdx=0;}
  else if(el.dataset.sel==='grupo'){moverGrupo(+el.value);return;}
  ui.confirm=null;guardarUI();render();
});
window.addEventListener('storage',function(e){if(e.key===LKEY){cargar();render();}});
window.addEventListener('online',pintarGuardado);window.addEventListener('offline',pintarGuardado);
if(mqAncho.addEventListener)mqAncho.addEventListener('change',function(){render();});else if(mqAncho.addListener)mqAncho.addListener(function(){render();});
window.addEventListener('pagehide',flushComentario);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushComentario();});

/* ---------- Inicio ---------- */
cargar();cargarUI();
if(location.hash==='#pautas'||location.hash==='#bitacora'||location.hash==='#respaldo')ui.tab=location.hash.slice(1);
if(['bitacora','pautas','respaldo'].indexOf(ui.tab)<0)ui.tab='bitacora';
if(['corregir','resumen'].indexOf(ui.pView)<0)ui.pView='corregir';
ui.grupoIdx=+ui.grupoIdx||0;
render();
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(function(p){return p?true:navigator.storage.persist();}).then(function(r){persistente=!!r;if(ui.tab==='respaldo')render();}).catch(function(){});}}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){swListo=true;if(ui.tab==='respaldo')render();}).catch(function(){});
}
})();
</script>
</body>
